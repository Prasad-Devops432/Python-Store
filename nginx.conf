server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        # Fall back to index.html so the single-page app still loads on refresh
        try_files $uri $uri/ /index.html;
    }
}
